<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div>
                <h1>Employee Dashboard</h1>
                <p id="welcomeMessage"></p>
            </div>
            <button type="button" id="logoutButton">Logout</button>
        </header>

        <section class="employee-information">
            <h2>My Information</h2>
            <div id="employeeInfo"></div>
        </section>

        <section class="leave-balances">
            <h2>Leave Balances</h2>
            <p>Balances shown here are your current entitlements. Pending requests do not deduct from the actual balance.</p>
            <div id="leaveBalances"></div>
        </section>

        <section class="dashboard-actions">
            <h2>Leave</h2>
            <button type="button" id="requestLeaveButton">Request Leave</button>
            <button type="button" id="leaveHistoryButton">Leave History</button>
        </section>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script>
        const dashboardUser = getCurrentUser();
        if (!dashboardUser || dashboardUser.role !== "employee") {
            window.location.href = "index.html";
        } else {
            syncEmployeeEntitlements(dashboardUser);
            const dashboardBalance = getEmployeeBalance(dashboardUser.employeeId);

            document.getElementById("welcomeMessage").textContent =
                `Welcome, ${dashboardUser.firstName} ${dashboardUser.surname}`;

            document.getElementById("employeeInfo").innerHTML = `
                <p><strong>Employee ID:</strong> ${escapeHtml(dashboardUser.employeeId)}</p>
                <p><strong>Name:</strong> ${escapeHtml(dashboardUser.firstName)} ${escapeHtml(dashboardUser.surname)}</p>
                <p><strong>Username:</strong> ${escapeHtml(dashboardUser.username)}</p>
                <p><strong>Employment Start Date:</strong> ${escapeHtml(dashboardUser.employmentStartDate)}</p>
            `;

            const balanceItems = [
                ["Annual Leave", dashboardBalance.annual],
                ["Sick Leave", dashboardBalance.sick],
                ["Maternity Leave", dashboardBalance.maternity],
                ["Parental Leave", dashboardBalance.parental],
                ["Family Responsibility", dashboardBalance.familyResponsibility],
                ["Study Leave", dashboardBalance.study],
                ["Birthday Leave", dashboardBalance.birthday],
                ["Unpaid Leave", 0]
            ];

            document.getElementById("leaveBalances").innerHTML = `
                <div class="balance-grid">
                    ${balanceItems.map(function (item) {
                        return `<div class="balance-card"><h3>${escapeHtml(item[0])}</h3><p>${escapeHtml(formatDays(item[1]))} days</p></div>`;
                    }).join("")}
                </div>
            `;
        }

        document.getElementById("logoutButton").addEventListener("click", function () {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        });
        document.getElementById("requestLeaveButton").addEventListener("click", function () {
            window.location.href = "request-leave.html";
        });
        document.getElementById("leaveHistoryButton").addEventListener("click", function () {
            window.location.href = "leave-history.html";
        });
    </script>
</body>
</html>
